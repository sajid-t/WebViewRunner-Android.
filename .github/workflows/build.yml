
name: Build WebViewRunner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0"

      
      - name: Build APK
        working-directory: WebViewRunner-android
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.2/bin/gradle --no-daemon assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebViewRunner-debug-APK
          path: WebViewRunner-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

